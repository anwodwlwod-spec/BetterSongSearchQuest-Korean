name: One-shot runtime Korean patch

on:
  push:
    branches: [ runtime-ko-patch ]
    paths: [ '.github/workflows/runtime-ko-patch.yml' ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-ko-patch

      - name: Patch runtime UI strings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/UI/ViewControllers/SongList.cpp')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Search by Song, Key, Mapper..': '곡명, 키, 매퍼로 검색..',
              'Search {} songs': '{}곡 검색',
              '{} songs in dataset ': '데이터셋 {}곡 ',
              'Loading dataset...': '데이터셋 불러오는 중...'
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count == 0:
                  raise SystemExit(f'missing expected string: {old}')
              s = s.replace(old, new)
              print(f'{old} -> {new}: {count}')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/UI/ViewControllers/SongList.cpp
          git commit -m "Translate runtime search UI strings to Korean"
          git push origin runtime-ko-patch

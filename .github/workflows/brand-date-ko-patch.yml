name: One-shot Korean date display patch

on:
  push:
    branches: [ brand-date-ko-patch ]
    paths: [ '.github/workflows/brand-date-ko-patch.yml' ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand-date-ko-patch
          fetch-depth: 0

      - name: Restore known-good FilterView and patch dates only
        run: |
          set -euo pipefail
          git checkout origin/korean-1.40.8 -- src/UI/ViewControllers/FilterView.cpp
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/UI/ViewControllers/FilterView.cpp')
          text = path.read_text(encoding='utf-8-sig')

          old_month = 'return fmt::format("{:%b:%Y}", fmt::localtime(std::chrono::system_clock::to_time_t(val)));'
          new_month = '''auto local_tm = fmt::localtime(std::chrono::system_clock::to_time_t(val));
        return fmt::format("{}년 {}월", local_tm.tm_year + 1900, local_tm.tm_mon + 1);'''

          old_detail = 'std::string timeScrapedString = fmt::format("{:%d %b %y - %H:%M}", local_tm);'
          new_detail = 'std::string timeScrapedString = fmt::format("{}년 {}월 {}일 - {:02}:{:02}", local_tm.tm_year + 1900, local_tm.tm_mon + 1, local_tm.tm_mday, local_tm.tm_hour, local_tm.tm_min);'

          month_count = text.count(old_month)
          detail_count = text.count(old_detail)
          if month_count != 1:
              raise SystemExit(f'unexpected month format count: {month_count}')
          if detail_count != 2:
              raise SystemExit(f'unexpected detailed date format count: {detail_count}')

          text = text.replace(old_month, new_month)
          text = text.replace(old_detail, new_detail)
          path.write_text(text, encoding='utf-8')

          print(f'month format patched: {month_count}')
          print(f'detailed date format patched: {detail_count}')
          PY

      - name: Commit repair and patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/UI/ViewControllers/FilterView.cpp
          git commit -m "Restore FilterView and use natural Korean dates"
          git push origin brand-date-ko-patch

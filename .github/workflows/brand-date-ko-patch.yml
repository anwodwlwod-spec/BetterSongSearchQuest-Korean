name: One-shot Korean date display patch

on:
  push:
    branches: [ brand-date-ko-patch ]
    paths: [ '.github/workflows/brand-date-ko-patch.yml' ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand-date-ko-patch

      - name: Patch Korean date display format
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/UI/ViewControllers/FilterView.cpp')
          text = path.read_text(encoding='utf-8-sig')

          old_month = 'return fmt::format("{:%Y.%m}", fmt::localtime(std::chrono::system_clock::to_time_t(val)));'
          new_month = '''auto local_tm = fmt::localtime(std::chrono::system_clock::to_time_t(val));
        return fmt::format("{}년 {}월", local_tm.tm_year + 1900, local_tm.tm_mon + 1);'''

          old_detail = 'std::string timeScrapedString = fmt::format("{:%Y.%m.%d - %H:%M}", local_tm);'
          new_detail = 'std::string timeScrapedString = fmt::format("{}년 {}월 {}일 - {:02}:{:02}", local_tm.tm_year + 1900, local_tm.tm_mon + 1, local_tm.tm_mday, local_tm.tm_hour, local_tm.tm_min);'

          if old_month not in text:
              raise SystemExit('missing expected month display format')
          detail_count = text.count(old_detail)
          if detail_count == 0:
              raise SystemExit('missing expected detailed date display format')

          text = text.replace(old_month, new_month)
          text = text.replace(old_detail, new_detail)
          path.write_text(text, encoding='utf-8')

          print('month format patched: 1')
          print(f'detailed date format patched: {detail_count}')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/UI/ViewControllers/FilterView.cpp
          git commit -m "Use natural Korean date display"
          git push origin brand-date-ko-patch
